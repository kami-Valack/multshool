version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: video-processing-rabbitmq
    ports:
      - "5672:5672"   # Porta AMQP
      - "15672:15672" # Porta Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - video-processing-network

volumes:
  rabbitmq_data:
    driver: local

networks:
  video-processing-network:
    driver: bridge


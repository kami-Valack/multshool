<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Escolas e Professores - Sistema Multishol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tab-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.85rem;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .response-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .response-box.show {
            display: block;
        }

        .response-box pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9rem;
        }

        .api-url-config {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .api-url-config label {
            color: white;
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .api-url-config input {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Sistema Multishol</h1>
            <p>Registrar Escolas e Professores</p>
        </div>

        <div class="api-url-config">
            <label for="api-url">URL da API:</label>
            <input type="text" id="api-url" value="https://paymente.reduaneamin.ct.ws/users/api" placeholder="URL da API">
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('school')">🏫 Registrar Escola</button>
            <button class="tab-button" onclick="showTab('teacher')">👨‍🏫 Registrar Professor</button>
        </div>

        <!-- Formulário de Escola -->
        <div id="school-form" class="form-container active">
            <h2 style="margin-bottom: 25px; color: #333;">Cadastrar Nova Escola</h2>
            
            <div id="school-alert" class="alert"></div>

            <form id="register-school-form">
                <div class="form-group">
                    <label for="school-name">Nome da Escola *</label>
                    <input type="text" id="school-name" name="name" required placeholder="Ex: Escola Exemplo">
                </div>

                <div class="form-group">
                    <label for="school-email">Email *</label>
                    <input type="email" id="school-email" name="email" required placeholder="escola@example.com">
                </div>

                <div class="form-group">
                    <label for="school-password">Senha *</label>
                    <input type="password" id="school-password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
                    <small>A senha deve ter no mínimo 8 caracteres</small>
                </div>

                <div class="form-group">
                    <label for="school-institution-type">Tipo de Instituição *</label>
                    <select id="school-institution-type" name="institution_type" required>
                        <option value="">Selecione o tipo</option>
                        <option value="medio">Ensino Médio</option>
                        <option value="superior">Ensino Superior</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit" id="school-submit-btn">Cadastrar Escola</button>
            </form>

            <div id="school-response" class="response-box"></div>
        </div>

        <!-- Formulário de Professor -->
        <div id="teacher-form" class="form-container">
            <h2 style="margin-bottom: 25px; color: #333;">Cadastrar Novo Professor</h2>
            
            <div id="teacher-alert" class="alert"></div>

            <form id="register-teacher-form">
                <div class="form-group">
                    <label for="teacher-name">Nome Completo *</label>
                    <input type="text" id="teacher-name" name="name" required placeholder="Ex: Professor João Silva">
                </div>

                <div class="form-group">
                    <label for="teacher-email">Email *</label>
                    <input type="email" id="teacher-email" name="email" required placeholder="professor@example.com">
                </div>

                <div class="form-group">
                    <label for="teacher-password">Senha *</label>
                    <input type="password" id="teacher-password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
                    <small>A senha deve ter no mínimo 8 caracteres</small>
                </div>

                <button type="submit" class="btn-submit" id="teacher-submit-btn">Cadastrar Professor</button>
            </form>

            <div id="teacher-response" class="response-box"></div>
        </div>
    </div>

    <script>
        // Configuração
        let apiUrl = 'https://paymente.reduaneamin.ct.ws/users/api';

        // Atualizar URL da API quando mudar
        document.getElementById('api-url').addEventListener('change', function() {
            apiUrl = this.value || 'https://paymente.reduaneamin.ct.ws/users/api';
        });

        // Função para alternar entre abas
        function showTab(tab) {
            // Remover active de todos os botões e formulários
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));

            // Adicionar active ao botão e formulário selecionados
            event.target.classList.add('active');
            document.getElementById(tab + '-form').classList.add('active');
        }

        // Função para mostrar alerta
        function showAlert(type, message, formType) {
            const alertDiv = document.getElementById(formType + '-alert');
            alertDiv.className = `alert alert-${type} show`;
            alertDiv.textContent = message;
            
            // Scroll para o topo do formulário
            alertDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            // Esconder após 5 segundos
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }

        // Função para mostrar resposta
        function showResponse(data, formType) {
            const responseDiv = document.getElementById(formType + '-response');
            responseDiv.innerHTML = '<strong>Resposta da API:</strong><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            responseDiv.classList.add('show');
        }

        // Formulário de Escola
        document.getElementById('register-school-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('school-submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Cadastrando...';

            const formData = {
                name: document.getElementById('school-name').value.trim(),
                email: document.getElementById('school-email').value.trim().toLowerCase(),
                password: document.getElementById('school-password').value,
                institution_type: document.getElementById('school-institution-type').value
            };

            try {
                const response = await fetch(`${apiUrl}/auth/register-school`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    showAlert('success', 'Escola cadastrada com sucesso!', 'school');
                    showResponse(data, 'school');
                    
                    // Limpar formulário
                    document.getElementById('register-school-form').reset();
                    
                    // Esconder resposta após 10 segundos
                    setTimeout(() => {
                        document.getElementById('school-response').classList.remove('show');
                    }, 10000);
                } else {
                    const errorMsg = data.message || data.errors ? JSON.stringify(data.errors || data) : 'Erro ao cadastrar escola';
                    showAlert('error', errorMsg, 'school');
                    showResponse(data, 'school');
                }
            } catch (error) {
                showAlert('error', 'Erro de conexão: ' + error.message, 'school');
                console.error('Erro:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Cadastrar Escola';
            }
        });

        // Formulário de Professor
        document.getElementById('register-teacher-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('teacher-submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Cadastrando...';

            const formData = {
                name: document.getElementById('teacher-name').value.trim(),
                email: document.getElementById('teacher-email').value.trim().toLowerCase(),
                password: document.getElementById('teacher-password').value
            };

            try {
                const response = await fetch(`${apiUrl}/auth/register-teacher`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    showAlert('success', 'Professor cadastrado com sucesso!', 'teacher');
                    showResponse(data, 'teacher');
                    
                    // Limpar formulário
                    document.getElementById('register-teacher-form').reset();
                    
                    // Esconder resposta após 10 segundos
                    setTimeout(() => {
                        document.getElementById('teacher-response').classList.remove('show');
                    }, 10000);
                } else {
                    const errorMsg = data.message || data.errors ? JSON.stringify(data.errors || data) : 'Erro ao cadastrar professor';
                    showAlert('error', errorMsg, 'teacher');
                    showResponse(data, 'teacher');
                }
            } catch (error) {
                showAlert('error', 'Erro de conexão: ' + error.message, 'teacher');
                console.error('Erro:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Cadastrar Professor';
            }
        });
    </script>
</body>
</html>
